[package]
name = "new-windterm-desktop"
version = "0.0.1"
description = "New WindTerm P0 desktop feasibility prototype"
edition = "2021"
license = "Apache-2.0"
default-run = "new-windterm-desktop"

[lib]
name = "new_windterm_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
portable-pty = "=0.9.0"
uuid = { version = "=1.18.1", features = ["v4"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
zeroize = { version = "=1.9.1", features = ["serde"] }

[dev-dependencies]
serde_json = "=1.0.152"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
pty-diagnostics = []
pty-readiness = []

[[bin]]
name = "pty_diagnose"
path = "src/bin/pty_diagnose.rs"
required-features = ["pty-diagnostics"]
