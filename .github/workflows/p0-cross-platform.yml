name: P0 cross-platform checks

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/p0-cross-platform.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/p0-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 — build and real PTY
            runner: macos-15
            host: aarch64-apple-darwin
            real_pty: true
          - name: Linux x64 — build and real PTY
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            real_pty: true
          - name: Windows x64 — build and ConPTY lifecycle tests
            runner: windows-2022
            host: x86_64-pc-windows-msvc
            real_pty: false
          - name: Windows x64 (Server 2025) — build and ConPTY lifecycle tests
            runner: windows-2025
            host: x86_64-pc-windows-msvc
            real_pty: false
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.0.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Record actual runner and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/p0-logs"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})' | tee "$RUNNER_TEMP/p0-logs/environment.log"
          rustc -vV | tee -a "$RUNNER_TEMP/p0-logs/environment.log"
          cargo --version | tee -a "$RUNNER_TEMP/p0-logs/environment.log"
          if [ "$RUNNER_OS" = Windows ]; then cmd //c ver | tee -a "$RUNNER_TEMP/p0-logs/environment.log"; fi
          actual_host=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual_host" = "${{ matrix.host }}"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend assets
        id: frontend
        working-directory: apps/desktop
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/p0-logs/frontend.log"

      - name: Check Rust formatting
        id: format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check all Rust targets
        id: rust_check
        run: cargo check --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/p0-logs/rust-check.log"

      - name: Run Rust unit, platform, Windows ConPTY lifecycle and loopback SSH protocol tests
        id: rust_tests
        run: cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/p0-logs/rust-tests.log"

      # Non-blocking until a first run confirms Ubuntu's lrzsz (only 0.13.1 on
      # macOS was verified); see docs/p0/MODEM.zh-CN.md. lrzsz (GPL) runs as an
      # external test peer only.
      - name: Run X/YMODEM interop tests against apt lrzsz (Linux, non-blocking)
        id: lrzsz_interop
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          P0_LRZSZ_REQUIRED: "1"
        run: |
          sudo apt-get install -y lrzsz
          dpkg-query -W lrzsz | tee "$RUNNER_TEMP/p0-logs/lrzsz-interop.log"
          cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --test modem_lrzsz -- --ignored --nocapture --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/p0-logs/lrzsz-interop.log"

      - name: Run Windows ConPTY handle diagnostics and leak cycles alone
        id: conpty_cycles
        if: runner.os == 'Windows'
        run: cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --ignored --exact --nocapture --test-threads=1 pty::windows_diag::handle_growth_by_lifecycle_step pty::windows_tests::open_output_close_reap_cycles_do_not_leak_handles 2>&1 | tee "$RUNNER_TEMP/p0-logs/conpty-cycles.log"

      - name: Run Clippy
        id: clippy
        run: cargo clippy --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/p0-logs/clippy.log"

      - name: Link desktop executable (unsigned, no installer)
        id: desktop_build
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --bin new-windterm-desktop 2>&1 | tee "$RUNNER_TEMP/p0-logs/desktop-build.log"

      - name: Run real Unix PTY probe
        id: pty
        if: matrix.real_pty
        run: cargo run --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features dev-tools --bin pty_probe 2>&1 | tee "$RUNNER_TEMP/p0-logs/pty-probe.log"

      - name: Run opt-in readiness Unix PTY probe
        id: pty_readiness
        if: matrix.real_pty
        run: cargo run --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features dev-tools,pty-readiness --bin pty_probe 2>&1 | tee "$RUNNER_TEMP/p0-logs/pty-readiness-probe.log"

      - name: Record exact acceptance boundary
        if: always()
        run: |
          {
            printf '### %s\n\n' '${{ matrix.name }}'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| Frontend assets | %s |\n' '${{ steps.frontend.outcome }}'
            printf '| Rust format | %s |\n' '${{ steps.format.outcome }}'
            printf '| Rust check | %s |\n' '${{ steps.rust_check.outcome }}'
            printf '| Unit/platform and controlled loopback SSH protocol tests | %s |\n' '${{ steps.rust_tests.outcome }}'
            printf '| Windows ConPTY handle-leak cycles (alone, 4 warm-up + 24) | %s |\n' '${{ steps.conpty_cycles.outcome }}'
            printf '| Clippy | %s |\n' '${{ steps.clippy.outcome }}'
            printf '| Desktop executable link | %s |\n' '${{ steps.desktop_build.outcome }}'
            printf '| Default real PTY probe | %s |\n' '${{ steps.pty.outcome }}'
            printf '| Opt-in readiness real PTY probe | %s |\n\n' '${{ steps.pty_readiness.outcome }}'
            printf 'Windows runs cmd.exe ConPTY lifecycle tests inside the Rust test step (exit code, UTF-8, resize, close, Ctrl-C, ACK budget/timeout, reload, Job Object tree reaping); a handle-leak check (4 warm-up + 24 open/close/reap cycles) runs alone in its own step; the Unix pty_probe is skipped there.\n\n'
            printf 'SSH tests use a bounded in-memory russh server, not an OS shell. No GUI, IME, WebView, PowerShell, signing, installer, OpenSSH interoperability, SFTP or full feature-parity acceptance is implied.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p0-${{ matrix.host }}-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-logs/
          if-no-files-found: warn
          retention-days: 14
