name: P0 cross-platform checks

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "tests/native/**"
      - ".cargo/config.toml"
      - "tools/gssapi-probe/**"
      - "rust-toolchain.toml"
      - ".github/workflows/p0-cross-platform.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "tests/native/**"
      - ".cargo/config.toml"
      - "tools/gssapi-probe/**"
      - "rust-toolchain.toml"
      - ".github/workflows/p0-cross-platform.yml"
  workflow_dispatch:
    inputs:
      native_only:
        description: "Diagnostic run: only the two native WebView jobs (not the full acceptance gate)"
        type: boolean
        default: false
      windows_shell_repeats:
        description: "Extra Windows shell diagnostics after the seven base scenarios (integer 0..10)"
        type: number
        default: 0
      windows_webview_timing:
        description: "Record bounded Windows WebView shell timing evidence"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p0-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gssapi:
    if: ${{ !inputs.native_only }}
    name: Linux x64 — isolated Rust GSSAPI and KDC probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build isolated probe image and run Rust unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/p0-gssapi"
          docker build --progress plain -t p0-gssapi-probe tools/gssapi-probe 2>&1 | tee "$RUNNER_TEMP/p0-gssapi/build.log"
          docker image inspect p0-gssapi-probe --format '{{.Id}}' | tee "$RUNNER_TEMP/p0-gssapi/image-id.log"

      - name: Run four authentication cases without host network or mounts
        id: gssapi_cases
        run: |
          timeout --kill-after=10 180 docker run --rm --network none --hostname localhost \
            --pids-limit 128 --memory 512m --name "p0-gssapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            p0-gssapi-probe 2>&1 | tee "$RUNNER_TEMP/p0-gssapi/cases.log"
          grep -qx 'P0_GSSAPI_RESULT 4 passed; 0 skipped' "$RUNNER_TEMP/p0-gssapi/cases.log"

      - name: Clean up only this run's container
        if: always()
        run: |
          container="p0-gssapi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$container" >/dev/null 2>&1; then docker rm -f "$container"; fi

      - name: Record probe boundary
        if: always()
        run: |
          {
            printf '### Isolated Rust GSSAPI probe\n\nCommit: %s\n\n' "$GITHUB_SHA"
            printf 'Four-case outcome: %s\n\n' '${{ steps.gssapi_cases.outcome }}'
            printf 'Rust gssapi-with-mic against a disposable MIT KDC and OpenSSH: valid, missing, expired and wrong-service tickets. No desktop authentication integration, macOS/Windows GSS bridge, credential delegation or full C14 acceptance is implied.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized probe logs only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p0-gssapi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-gssapi/
          if-no-files-found: warn
          retention-days: 14

  desktop:
    if: ${{ !inputs.native_only }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 — build and real PTY
            runner: macos-15
            host: aarch64-apple-darwin
            real_pty: true
          - name: Linux x64 — build and real PTY
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            real_pty: true
          - name: Windows x64 — build and ConPTY lifecycle tests
            runner: windows-2022
            host: x86_64-pc-windows-msvc
            real_pty: false
          - name: Windows x64 (Server 2025) — build and ConPTY lifecycle tests
            runner: windows-2025
            host: x86_64-pc-windows-msvc
            real_pty: false
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      # Loopback authentication shares the production four-reader capacity.
      # Bound independent tests; concurrency within each test stays unchanged.
      RUST_TEST_THREADS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.0.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Record actual runner and toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/p0-logs"
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})' | tee "$RUNNER_TEMP/p0-logs/environment.log"
          rustc -vV | tee -a "$RUNNER_TEMP/p0-logs/environment.log"
          cargo --version | tee -a "$RUNNER_TEMP/p0-logs/environment.log"
          if [ "$RUNNER_OS" = Windows ]; then cmd //c ver | tee -a "$RUNNER_TEMP/p0-logs/environment.log"; fi
          actual_host=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual_host" = "${{ matrix.host }}"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend assets
        id: frontend
        working-directory: apps/desktop
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/p0-logs/frontend.log"

      - name: Check Rust formatting
        id: format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check all Rust targets
        id: rust_check
        run: cargo check --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/p0-logs/rust-check.log"

      - name: Run Rust unit, platform, Windows ConPTY lifecycle and loopback SSH protocol tests
        id: rust_tests
        run: cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/p0-logs/rust-tests.log"

      # Non-blocking until a first run confirms Ubuntu's lrzsz (only 0.13.1 on
      # macOS was verified); see docs/p0/MODEM.zh-CN.md. lrzsz (GPL) runs as an
      # external test peer only.
      - name: Run X/YMODEM interop tests against apt lrzsz (Linux, non-blocking)
        id: lrzsz_interop
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          P0_LRZSZ_REQUIRED: "1"
        run: |
          sudo apt-get install -y lrzsz
          dpkg-query -W lrzsz | tee "$RUNNER_TEMP/p0-logs/lrzsz-interop.log"
          cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --test modem_lrzsz -- --ignored --nocapture --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/p0-logs/lrzsz-interop.log"

      - name: Run Windows ConPTY handle diagnostics and leak cycles alone
        id: conpty_cycles
        if: runner.os == 'Windows'
        run: cargo test --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --ignored --exact --nocapture --test-threads=1 pty::windows_diag::handle_growth_by_lifecycle_step pty::windows_tests::open_output_close_reap_cycles_do_not_leak_handles 2>&1 | tee "$RUNNER_TEMP/p0-logs/conpty-cycles.log"

      - name: Run Clippy
        id: clippy
        run: cargo clippy --all-features --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/p0-logs/clippy.log"

      - name: Link desktop executable (unsigned, no installer)
        id: desktop_build
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --bin new-windterm-desktop 2>&1 | tee "$RUNNER_TEMP/p0-logs/desktop-build.log"

      - name: Run real Unix PTY probe
        id: pty
        if: matrix.real_pty
        env:
          P0_PTY_CLEANUP_TRACE: "1"
        run: cargo run --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features dev-tools --bin pty_probe 2>&1 | tee "$RUNNER_TEMP/p0-logs/pty-probe.log"

      - name: Run opt-in readiness Unix PTY probe
        id: pty_readiness
        if: matrix.real_pty
        env:
          P0_PTY_CLEANUP_TRACE: "1"
        run: cargo run --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features dev-tools,pty-readiness --bin pty_probe 2>&1 | tee "$RUNNER_TEMP/p0-logs/pty-readiness-probe.log"

      # Private sshd (X11Forwarding yes) and Xvfb with a generated cookie; the
      # Rust client runs xdpyinfo remotely through the forwarded display.
      - name: Run X11 forwarding against OpenSSH and Xvfb (Linux only)
        id: x11_openssh
        if: runner.os == 'Linux'
        env:
          P0_X11_REQUIRED: "1"
        run: |
          sudo apt-get install --no-install-recommends -y openssh-server xvfb xauth x11-utils
          node --test tests/fixtures/ssh-terminal/x11-client.test.mjs 2>&1 | tee "$RUNNER_TEMP/p0-logs/x11-openssh.log"

      # Private sshd (AllowAgentForwarding yes) and a private ssh-agent with a
      # generated key; remote ssh-add -l must list it only on the opted-in
      # connection. The runner home is disposable, so sshd 10.1+ may bind its
      # forwarded socket under ~/.ssh/agent here.
      - name: Run ssh-agent forwarding against OpenSSH (Linux only)
        id: agent_openssh
        if: runner.os == 'Linux'
        env:
          P0_AGENT_REQUIRED: "1"
          P0_AGENT_HOME_SOCKET: "1"
        run: |
          sudo apt-get install --no-install-recommends -y openssh-server openssh-client
          node --test tests/fixtures/ssh-terminal/agent-client.test.mjs 2>&1 | tee "$RUNNER_TEMP/p0-logs/agent-openssh.log"

      - name: Record exact acceptance boundary
        if: always()
        run: |
          {
            printf '### %s\n\n' '${{ matrix.name }}'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| Frontend assets | %s |\n' '${{ steps.frontend.outcome }}'
            printf '| Rust format | %s |\n' '${{ steps.format.outcome }}'
            printf '| Rust check | %s |\n' '${{ steps.rust_check.outcome }}'
            printf '| Unit/platform and controlled loopback SSH protocol tests | %s |\n' '${{ steps.rust_tests.outcome }}'
            printf '| Windows ConPTY handle-leak cycles (alone, 4 warm-up + 24) | %s |\n' '${{ steps.conpty_cycles.outcome }}'
            printf '| Clippy | %s |\n' '${{ steps.clippy.outcome }}'
            printf '| Desktop executable link | %s |\n' '${{ steps.desktop_build.outcome }}'
            printf '| Default real PTY probe | %s |\n' '${{ steps.pty.outcome }}'
            printf '| Opt-in readiness real PTY probe | %s |\n' '${{ steps.pty_readiness.outcome }}'
            printf '| X/YMODEM against lrzsz (non-blocking; inspect outcome) | %s |\n' '${{ steps.lrzsz_interop.outcome }}'
            printf '| X11 forwarding against OpenSSH and Xvfb | %s |\n' '${{ steps.x11_openssh.outcome }}'
            printf '| Agent forwarding against OpenSSH | %s |\n\n' '${{ steps.agent_openssh.outcome }}'
            printf 'Windows runs cmd.exe ConPTY lifecycle tests inside the Rust test step (exit code, UTF-8, resize, close, Ctrl-C, ACK budget/timeout, reload, Job Object tree reaping); a handle-leak check (4 warm-up + 24 open/close/reap cycles) runs alone in its own step; the Unix pty_probe is skipped there.\n\n'
            printf 'The Rust test step uses controlled loopback SSH fixtures. Separate Linux steps exercise X11 and agent forwarding against OpenSSH; their outcomes above apply only to those paths. No IME, PowerShell, signing, installer, SFTP or full feature-parity acceptance is implied. Native WebView smoke is reported by its separate job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p0-${{ matrix.host }}-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-logs/
          if-no-files-found: warn
          retention-days: 14

  # Real Tauri native WebView (WebKitGTK / WebView2) driven through
  # tauri-driver; macOS WKWebView has no WebDriver support in tauri-driver.
  # See docs/p0/NATIVE_WEBVIEW_SMOKE.zh-CN.md.
  native-webview:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 — native WebKitGTK smoke (tauri-driver)
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - name: Windows x64 — native WebView2 smoke (tauri-driver)
            runner: windows-2022
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      TAURI_DRIVER_VERSION: "2.0.6"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.0.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate native diagnostic inputs before installing or building
        env:
          NATIVE_SHELL_REPEATS_INPUT: ${{ inputs.windows_shell_repeats || 0 }}
        run: |
          node --input-type=module -e 'import { parseShellRepeats } from "./tests/native/runner-config.mjs"; parseShellRepeats(process.env.NATIVE_SHELL_REPEATS_INPUT);'

      - name: Install Linux Tauri prerequisites, Xvfb and the matching WebKitWebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
          # Pin the driver to exactly the WebKitGTK build the app links against.
          webkit_version=$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)
          sudo apt-get install --no-install-recommends -y "webkit2gtk-driver=$webkit_version"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Unit-test the WebDriver client and runner helpers
        run: node --test tests/native/webdriver.test.mjs tests/native/support.test.mjs tests/native/runner-config.test.mjs

      - name: Build production frontend assets
        working-directory: apps/desktop
        run: npm run build

      - name: Link desktop executable with the bundled frontend (same command as the desktop job)
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --bin new-windterm-desktop

      - name: Build the loopback russh SSH fixture
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features dev-tools --bin ssh_terminal_fixture

      - name: Install pinned tauri-driver
        run: cargo install tauri-driver --locked --version "=$TAURI_DRIVER_VERSION" --root "$RUNNER_TEMP/native-tools"

      - name: Install msedgedriver matching the WebView2 Runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/p0-native"
          driver=$(node tests/native/msedgedriver.mjs --dest "$RUNNER_TEMP/msedgedriver" --record "$RUNNER_TEMP/p0-native/msedgedriver.json")
          echo "P0_NATIVE_EDGEDRIVER=$driver" >> "$GITHUB_ENV"

      - name: Record WebView runtime and driver versions
        run: |
          out="$RUNNER_TEMP/p0-native"
          mkdir -p "$out"
          {
            echo "tauri-driver: $(cargo install --list --root "$RUNNER_TEMP/native-tools" | grep '^tauri-driver ')"
            if [ "$RUNNER_OS" = Linux ]; then
              dpkg-query -W libwebkit2gtk-4.1-0 webkit2gtk-driver
              echo "WebKitWebDriver: $(WebKitWebDriver --version)"
              ldd apps/desktop/src-tauri/target/debug/new-windterm-desktop | grep -E 'libwebkit2gtk|libjavascriptcoregtk'
            else
              cat "$out/msedgedriver.json"
            fi
          } 2>&1 | tee "$out/versions.log"

      - name: Run native WebView smoke (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          P0_NATIVE_TAURI_DRIVER: ${{ runner.temp }}/native-tools/bin/tauri-driver
          P0_NATIVE_SSH_FIXTURE: apps/desktop/src-tauri/target/debug/ssh_terminal_fixture
        run: P0_NATIVE_OUT="$RUNNER_TEMP/p0-native" xvfb-run -a --server-args="-screen 0 1600x1000x24" node tests/native/run.mjs

      - name: Run native WebView smoke (Windows)
        if: runner.os == 'Windows'
        env:
          P1_NATIVE_SHELL_REPEATS: ${{ inputs.windows_shell_repeats || 0 }}
          P1_NATIVE_WEBVIEW_TIMING: ${{ inputs.windows_webview_timing && '1' || '0' }}
          P0_NATIVE_TAURI_DRIVER: ${{ runner.temp }}/native-tools/bin/tauri-driver
          P0_NATIVE_SSH_FIXTURE: apps/desktop/src-tauri/target/debug/ssh_terminal_fixture
        run: P0_NATIVE_OUT="$RUNNER_TEMP/p0-native" node tests/native/run.mjs

      - name: Upload native WebView evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p0-native-webview-${{ matrix.host }}-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-native/
          if-no-files-found: warn
          retention-days: 14
