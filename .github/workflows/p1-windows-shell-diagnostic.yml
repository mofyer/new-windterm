name: P1 Windows Shell Latency Diagnostic

on:
  push:
    branches: [p1/integration]
    paths:
      - .github/workflows/p1-windows-shell-diagnostic.yml
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/bin/powershell_conpty_probe.rs
      - rust-toolchain.toml
      - tests/native/powershell-latency-probe.mjs
      - tests/native/powershell-latency-probe.test.mjs
      - tests/native/powershell-stderr-fixture.mjs
      - tests/native/powershell-stderr-fixture.test.mjs
      - tests/native/stderr-structure.mjs
      - tests/native/stderr-structure.test.mjs
      - tests/native/conpty-report.mjs
      - tests/native/conpty-report.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-latency:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.0.0"
      - name: Validate diagnostic schema
        run: node --test tests/native/*.test.mjs
      - name: Compare eight bounded environments in forward and reverse order
        run: node tests/native/powershell-latency-probe.mjs
      - name: Run isolated PowerShell stderr fixture
        if: always()
        run: node tests/native/powershell-stderr-fixture.mjs
      - name: Preserve sanitized stderr fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-stderr-fixture-${{ matrix.os }}
          path: .artifacts/p1/powershell-stderr-fixture/
          if-no-files-found: error
      - name: Preserve every measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-latency-${{ matrix.os }}
          path: .artifacts/p1/powershell-latency/
          if-no-files-found: error

  powershell-conpty:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.0.0"
      - name: Validate diagnostic schema
        run: node --test tests/native/*.test.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run direct PowerShell ConPTY probe
        run: node tests/native/conpty-report.mjs
      - name: Preserve sanitized ConPTY report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powershell-conpty-${{ matrix.os }}
          path: .artifacts/p1/powershell-conpty/report.json
          if-no-files-found: error
